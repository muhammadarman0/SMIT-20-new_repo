<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">

        <div class="todo-header">
            <h1>📝 Todo App</h1>
            <p>Stay organized and productive</p>
        </div>

        <div class="todo-input-box">
            <input
                type="text"
                id="taskInput"
                placeholder="Add a new task..."
            >
            <button id="addBtn">Add Task</button>
        </div>

        <div class="todo-filter">
            <button class="active" id="showAll">All</button>
            <button id="pendingWork" class="active">Pending</button>
            <button id="completeTask" class="active">Completed</button>
        </div>

        <ul class="todo-list" id="todolist">


        </ul>

        <div class="todo-footer">
            <span>Tasks Remaining: <strong id="pendingCount">0</strong></span>
            <button class="clear-btn" onclick="clearCompleted(this)">Clear Completed Task</button>
        </div>

    </div>

  <script src="app.js"></script>

</body>
</html>
