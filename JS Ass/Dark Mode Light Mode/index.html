<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark & Light UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="body">

    <div id="container">

        <header id="header">
            <h1 id="logo">My Dashboard</h1>

            <div id="theme-switch">
                <input type="checkbox" id="toggle">
                <label for="toggle" id="toggle-label"></label>
            </div>
        </header>

        <main id="main">

            <div id="card-1" class="card">
                <h2 id="card-title-1">Welcome</h2>
                <p id="card-text-1">
                    Beautiful Dark & Light Mode UI using only HTML,CSS and JS. 
                </p>
            </div>

            <div id="card-2" class="card">
                <h2 id="card-title-2">Profile</h2>
                <p id="card-text-2">
                    Add your profile information here.
                </p>
            </div>

            <div id="card-3" class="card">
                <h2 id="card-title-3">Projects</h2>
                <p id="card-text-3">
                    Display your latest projects here.
                </p>
            </div>

        </main>

    </div>


    <script src="app.js"></script>
</body>
</html>
