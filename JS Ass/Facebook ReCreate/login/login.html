<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="login.css">
    <title>Facebook | Login</title>
</head>

<body>
    <div class="container">
        <!-- main Container open  -->

        <div class="logo">
            <img src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCu2zih0ca.svg" alt=""
                class="logo animate__animated animate__bounce" width="100px" height="50px" />
        </div>

        <div class="loginBox">
            <!-- box content -->

            <div class="login-form">
                <p>Log in to Facebook</p>

                <input id="email" type="text" placeholder="Email address or phone number">
                <div class="pass">
                    <input id="password" type="password" placeholder="Password">
                    <i class="fa-solid fa-eye-slash" id="toggle"></i>
                </div>
            </div>


            <!--  Register Btn-->
            <div class="login">
                <button id="loginBtn">Login</button>
            </div>

            <div class="loginLinks">
                <a href="#">Forgotten Account?</a>.
                <a href="../singup/singup.html">Sign up for Facebook</a>
            </div>

            <!-- register box end -->
        </div>

        <!-- main Container closed  -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="login.js"></script>


</body>

</html>
