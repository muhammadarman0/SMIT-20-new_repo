<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- LEFT -->

    <div class="left">

        <div class="fb-logo">f</div>

        <div class="left-content">
            <div class="title">
                Explore <br>
                the things <br>
                <span>you</span> love.
            </div>
        </div>

        <div class="image-box">

            <div class="emoji">😊</div>

            <img class="main-img" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=600">

            <div class="heart">❤️</div>

            <div class="small-card">

                <img src="https://images.unsplash.com/photo-1517639493569-5666a7b2f494?q=80&w=600">

                <div class="circle-img">
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=600">
                </div>

            </div>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="login-box">

            <div class="login-title">
                Log in to Facebook
            </div>

            <div class="input-box">
                <input id="email" type="text" placeholder="Email address or mobile number">
            </div>

            <div class="input-box">
                <input id="password" type="password" placeholder="Password">
            </div>

            <button onclick="loginHandler(event)" id="loginDashboard" class="login-btn">
                Log in
            </button>

            <div class="forgot">
                Forgotten password?
            </div>

            <button id="createAccount" class="create-btn">
                Create new account
            </button>

            <div class="meta">
                ∞ Meta
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="login.js"></script>
</body>

</html>
