<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook login || signup</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>


  


    <div class="signup-box">
        <div class="logo">facebook</div>
        <div class="subtitle">
            Create a new account to connect with friends.
        </div>

        <form>
            <div class="row">
                <div class="input-box">
                    <label>First Name</label>
                    <input id="firstName" type="text" placeholder="First Name">
                </div>

                <div class="input-box">
                    <label>Surname</label>
                    <input id="lastName" type="text" placeholder="Surname">
                </div>
            </div>

            <div class="input-box">
                <label>Date of Birth</label>

                <div class="row">
                    <select id="days" name="dob-day" class="datefield day">
                        <option value="">Day</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                        <option value="31">31</option>
                    </select>

                    <select id="months" name="dob-month" class="datefield month">
                        <option value="">Month</option>
                        <option value="Jan">January</option>
                        <option value="Feb">February</option>
                        <option value="Mar">March</option>
                        <option value="Apr">April</option>
                        <option value="May">May</option>
                        <option value="Jun">June</option>
                        <option value="Jul">July</option>
                        <option value="Aug">August</option>
                        <option value="Sep">September</option>
                        <option value="Oct">October</option>
                        <option value="Nov">November</option>
                        <option value="Dec">December</option>
                    </select>

                    <select id="years" name="dob-year" class="datefield year">
                        <option value="">Year</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                        <option value="2018">2018</option>
                        <option value="2017">2017</option>
                        <option value="2016">2016</option>
                        <option value="2015">2015</option>
                        <option value="2014">2014</option>
                        <option value="2013">2013</option>
                        <option value="2012">2012</option>
                        <option value="2011">2011</option>
                        <option value="2010">2010</option>
                        <option value="2009">2009</option>
                        <option value="2008">2008</option>
                        <option value="2007">2007</option>
                    </select>
                </div>
            </div>

            <div class="input-box">
                <label>Gender</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <div class="input-box">
                <label>Mobile Number or Email</label>
                <input id="mobileEmail" type="text" placeholder="Enter email or number">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input id="password" type="password" placeholder="Enter password">
            </div>

            <p class="info-text">
                By clicking Sign Up, you agree to our Terms, Privacy Policy and Cookies Policy.
            </p>

            <button class="signup-btn" onclick="signupHanlder(event)">Sign Up</button>

            <button id="readyHandler" type="button" class="login-btn">
                I already have an account
            </button>
        </form>
    </div>


    <script src="signup.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
